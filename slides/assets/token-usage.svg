<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="294" viewBox="0 0 1100 294" role="img" aria-label="Illustrative token usage across three model calls">
<style>text{font-family:Arial,Liberation Sans,sans-serif}.lab{font-size:28px;fill:#17324D}.bartext{font-size:22px;fill:white;font-weight:bold}.small{font-size:21px;fill:#607487}.total{font-size:26px;fill:#003359;font-weight:bold}</style>
<g>
<text x="14" y="60" class="lab">Call 1</text>
<rect x="170" y="24" width="260" height="51" rx="3" fill="#00747A"/><rect x="430" y="24" width="52" height="51" fill="#FF7900"/>
<text x="300" y="56" text-anchor="middle" class="bartext">1,000 input</text>
<text x="503" y="57" class="small">+ 200 output = 1,200</text>
<text x="14" y="136" class="lab">Call 2</text>
<rect x="170" y="101" width="520" height="51" rx="3" fill="#00747A"/><rect x="690" y="101" width="78" height="51" fill="#FF7900"/>
<text x="430" y="133" text-anchor="middle" class="bartext">2,000 input</text>
<text x="786" y="134" class="small">+ 300 output = 2,300</text>
<text x="14" y="213" class="lab">Call 3</text>
<rect x="170" y="178" width="780" height="51" rx="3" fill="#00747A"/><rect x="950" y="178" width="78" height="51" fill="#FF7900"/>
<text x="560" y="210" text-anchor="middle" class="bartext">3,000 input</text>
<text x="1060" y="208" text-anchor="middle" class="small">+300</text>
<text x="16" y="273" class="total">Session total: 1,200 + 2,300 + 3,300 = 6,800 tokens</text>
</g></svg>