<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 229" width="1100" height="229"><defs><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#00747A"/></marker><marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#FF7900"/></marker></defs><style>text{font-family:Arial,'Liberation Sans',sans-serif}</style><rect x="10" y="14" width="351" height="203" rx="14" fill="#F4F8FA" stroke="#003359" stroke-width="2.6"/><text x="29" y="61" font-size="26" font-weight="700" text-anchor="start" fill="#003359">Shared kernel</text><text x="29" y="111" font-size="19" font-weight="400" text-anchor="start" fill="#17324D">A container uses the host kernel.</text><text x="29" y="145" font-size="19" font-weight="400" text-anchor="start" fill="#17324D">VMs have a guest kernel.</text><rect x="29" y="172" width="112" height="26" rx="6" fill="#E5F3F0" stroke="#00747A" stroke-width="1.2"/><text x="85" y="190" font-size="16" font-weight="700" text-anchor="middle" fill="#003359">kernel</text><rect x="377" y="14" width="351" height="203" rx="14" fill="#FFF1E6" stroke="#FF7900" stroke-width="2.6"/><text x="396" y="61" font-size="26" font-weight="700" text-anchor="start" fill="#003359">Privileged interfaces</text><text x="396" y="111" font-size="19" font-weight="400" text-anchor="start" fill="#17324D">Daemon sockets and elevated modes</text><text x="396" y="145" font-size="19" font-weight="400" text-anchor="start" fill="#17324D">can bypass intended limits.</text><rect x="396" y="172" width="112" height="26" rx="6" fill="#FFDDBD" stroke="#FF7900" stroke-width="1.2"/><text x="452" y="190" font-size="16" font-weight="700" text-anchor="middle" fill="#003359">runtime</text><rect x="744" y="14" width="351" height="203" rx="14" fill="#F4F8FA" stroke="#003359" stroke-width="2.6"/><text x="763" y="61" font-size="26" font-weight="700" text-anchor="start" fill="#003359">Network &amp; secrets</text><text x="763" y="111" font-size="19" font-weight="400" text-anchor="start" fill="#17324D">Accessible credentials and endpoints</text><text x="763" y="145" font-size="19" font-weight="400" text-anchor="start" fill="#17324D">still need separate controls.</text><rect x="763" y="172" width="112" height="26" rx="6" fill="#E5F3F0" stroke="#00747A" stroke-width="1.2"/><text x="819" y="190" font-size="16" font-weight="700" text-anchor="middle" fill="#003359">permissions</text></svg>