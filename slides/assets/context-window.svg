<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="310" viewBox="0 0 1100 310" role="img"><style>text {font-family: Arial, Liberation Sans, sans-serif;} .n {font-size:28px;font-weight:bold;fill:#003359} .m {font-size:23px;fill:#17324D} .sm {font-size:20px;fill:#607487} .white {fill:white;} .bold {font-weight:bold;} .arrow {stroke:#607487;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#607487"/></marker></defs><text x="22" y="37" class="m" text-anchor="start">Example: input and output within a limited token budget</text><rect x="22" y="87" width="160" height="105" fill="#003359" /><text x="102.0" y="148" class="m white" text-anchor="middle">Rules</text><rect x="182" y="87" width="182" height="105" fill="#00747A" /><text x="273.0" y="148" class="m white" text-anchor="middle">Task</text><rect x="364" y="87" width="205" height="105" fill="#5D9CA0" /><text x="466.5" y="148" class="m white" text-anchor="middle">History</text><rect x="569" y="87" width="287" height="105" fill="#7B9CB8" /><text x="712.5" y="133" class="m white" text-anchor="middle">Tool</text><text x="712.5" y="162" class="m white" text-anchor="middle">results</text><rect x="856" y="87" width="180" height="105" fill="#FF7900" /><text x="946.0" y="148" class="m white" text-anchor="middle">Output</text><rect x="22" y="87" width="1014" height="105" fill="none" stroke="#003359" stroke-width="2" /><text x="22" y="239" class="sm" text-anchor="start">Illustrative only – proportions are not fixed.</text><text x="22" y="274" class="m" text-anchor="start">The harness selects what is actually sent to the model.</text></svg>