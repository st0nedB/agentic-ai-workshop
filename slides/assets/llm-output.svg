<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="275" viewBox="0 0 1100 275" role="img"><style>text {font-family: Arial, Liberation Sans, sans-serif;} .n {font-size:28px;font-weight:bold;fill:#003359} .m {font-size:23px;fill:#17324D} .sm {font-size:20px;fill:#607487} .white {fill:white;} .bold {font-weight:bold;} .arrow {stroke:#607487;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#607487"/></marker></defs><rect x="30" y="46" width="284" height="112" rx="15" fill="#F4F8FA" stroke="#00747A" stroke-width="2.5"/><rect x="409" y="27" width="276" height="151" rx="15" fill="#003359" stroke="#003359" stroke-width="2.5"/><rect x="779" y="46" width="286" height="112" rx="15" fill="#F4F8FA" stroke="#FF7900" stroke-width="2.5"/><text x="172" y="92" class="m bold" text-anchor="middle">Instructions + context</text><text x="172" y="128" class="sm" text-anchor="middle">Token sequence</text><text x="547" y="92" class="n white" text-anchor="middle">LLM</text><text x="547" y="132" class="m white" text-anchor="middle">Token probabilities</text><text x="922" y="92" class="n" text-anchor="middle">Generated tokens</text><text x="922" y="128" class="sm" text-anchor="middle">e.g. text / tool call</text><path d="M315 101 H400" class="arrow" marker-end="url(#arrow)"/><path d="M686 101 H768" class="arrow" marker-end="url(#arrow)"/><text x="549" y="232" class="m" text-anchor="middle">Autoregressive: each new token depends on the preceding tokens.</text></svg>